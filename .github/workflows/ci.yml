# ═══════════════════════════════════════════════════════════════
#  CI de ActiveCard — el "inspector de calidad" automático.
#  En cada cambio subido a GitHub, una máquina limpia instala todo,
#  pasa el corrector (ESLint) y corre los tests (Jest).
#  Resultado: ✓ verde o ✗ roja al lado de cada commit en GitHub.
# ═══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Doctor + corrector + tests + export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # El APK 1.4.0 falló en los servidores de EAS por un lockfile con un árbol
      # híbrido (@react-native/* en 0.86.0 en la raíz y 0.86.2 anidados). Ni el
      # `npm ci` de esta CI ni el de la PC lo detectaban: los dos lo toleraban y
      # el de EAS no. Este control sí lo agarra — si regenerar el lock lo
      # modifica, es que estaba desincronizado con package.json.
      - name: El lockfile tiene que estar sincronizado con package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            echo "::error file=package-lock.json::package-lock.json está desincronizado con package.json. Corré 'npm install' y commiteá el lockfile: así está, el build de EAS falla en INSTALL_DEPENDENCIES."
            git --no-pager diff --stat -- package-lock.json
            exit 1
          fi

      - name: Instalar dependencias (limpio, como un usuario nuevo)
        run: npm ci

      # Una OTA conserva el runtime del APK. Validar contra el mapa incluido
      # en el SDK instalado evita exigir parches nativos nuevos para cambios JS.
      - name: Compatibilidad con el Expo SDK instalado
        env:
          EXPO_OFFLINE: "1"
        run: npx expo-doctor

      # La recomendación remota se conserva visible para el próximo APK.
      # No modifica el lockfile ni bloquea una OTA del runtime existente.
      - name: Parches Expo disponibles (informativo)
        continue-on-error: true
        run: npx expo-doctor

      - name: Corrector de código (ESLint)
        run: npx eslint . --max-warnings 0

      - name: Tests de la lógica (Jest)
        run: npx jest --ci

      - name: Sincronización en SQLite y Postgres reales
        run: |
          node scripts/verify-sync-sqlite.mjs
          node scripts/verify-sync-sql.mjs

      - name: Export Android de control
        env:
          EXPO_NO_DOTENV: "1"
        run: npx expo export --platform android --clear

      # Validar también los componentes y dependencias exclusivos del navegador.
      - name: Export web de control
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_OPENAI_API_KEY: "DISABLED_USE_DEVICE_SETTINGS"
          EXPO_PUBLIC_NOTION_TOKEN: "DISABLED_USE_DEVICE_SETTINGS"
          EXPO_PUBLIC_ANTHROPIC_API_KEY: "DISABLED_USE_DEVICE_SETTINGS"
        run: npx expo export --platform web --output-dir .web-ci

      - name: Guardar vista web para revisión visual
        uses: actions/upload-artifact@v4
        with:
          name: activecard-web-preview
          path: .web-ci
          retention-days: 1
